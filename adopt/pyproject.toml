[tool.poetry]
name = "adopt"
# Follows the adopt release tag (`adopt-v0.1.85`), not a series of its
# own -- see planning/release-process.md, "The package version".
version = "0.1.87"
description = ""
authors = ["Nandan Rao <nandanmarkrao@gmail.com>"]

[tool.poetry.dependencies]
# NARROWED FROM ">=3.9,<3.11" ON 2026-09-06, and the floor is now real rather
# than aspirational. `mcp` requires Python >= 3.10, and `server/server.py`
# imports `server/mcp_server.py` at module scope to mount `POST /mcp` -- so on
# 3.9 `mcp` would not be installed and the conf service would not IMPORT, let
# alone start. Declaring 3.9 support that the service cannot honour is worse
# than declaring 3.10.
#
# Nothing was actually running on 3.9: the Dockerfile is `python:3.10-slim`, CI
# is `python-version: '3.10'`, and the SDK install line has said
# `pipx install --python python3.10` since Phase 3. The ceiling stays at <3.11
# for pandas 1.5.3 / numpy 1.x; VIR-47 is where it gets lifted.
python = ">=3.10,<3.11"
PyYAML = "^6.0.1"
backoff = "^1.10.0"
environs = "^9.3.2"
facebook-business = "v22"
# THE NUMERIC STACK, lifted under VIR-47 (planning/pandas2-numpy2-python-upgrade.md,
# Phase A). The old floor was pandas 1.5.3 pinned EXACTLY, which is what held the
# whole package on Python <3.11: pandas 1.5 publishes no wheels past cp310, so
# every other ceiling here was downstream of it.
#
# The ceilings are not arbitrary and are not "latest":
#   - numpy ^2.2, not ^2.0 and not ^2.3, because 2.2.x is the newest line that
#     still declares `requires_python >=3.10`; 2.3 moved its own floor to 3.11
#     and would silently drop this package's floor on the next re-lock.
#   - scipy ^1.15 for the same reason -- 1.16 raised its floor to 3.11. 1.15 also
#     satisfies cvxpy's `scipy>=1.13.0`.
#   - pandas ^2.2 (caret, so pandas 3 -- already on PyPI -- stays out).
# cvxpy and ecos are deliberately left on their existing constraints: their
# cp310 wheels already extend past these picks, and ecos 2.0.14 is both current
# and latest, so it is the real binding constraint on the Python ceiling.
numpy = "^2.2"
pandas = "^2.2"
pystache = "^0.6.0"
requests = "^2.25.1"
scipy = "^1.15"
toolz = "^0.11.1"
# Floor lifted from ^3.0.9 as part of the same ticket. `psycopg[binary]` has no
# cp311/cp312 wheels before 3.1.19 and 3.0.x tops out at cp310, so the old
# constraint would have re-pinned us to 3.10 the moment the Python ceiling moves
# (Phase B). ^3.2 has cp310-cp314 wheels, i.e. headroom rather than a fresh
# ceiling.
psycopg = {extras = ["binary", "pool"], version = "^3.2"}
# Floor raised from ^3.0.9 by the pandas bump, and it is a HARD requirement, not
# hygiene: pandas 2.2 lists openpyxl 3.1.0 as its minimum in
# `pandas.compat._optional.VERSIONS`, and `pd.read_excel` raises ImportError --
# not a warning -- on anything older. The old `^3.0.9` range technically admitted
# 3.1, but the lock had resolved 3.0.9, so every `authoring/sheets.py` reader
# died at import_optional_dependency until this floor made it explicit.
openpyxl = "^3.1"
orjson = "^3.6.6"
# PINNED TO A PATCH RANGE, not a caret, and that is not caution -- it is that
# `make check-schemas` compares committed JSON Schemas against what pydantic
# renders, and pydantic changes the rendering between minors. `Literal["app"]`
# is `{const, title}` on 2.5.2, `{const, enum, title, type}` on 2.9.x, and
# `{const, title, type}` on 2.13 -- the `enum` appears and then disappears
# again. Under `^2.5.2` the next unrelated PR that re-resolves the lock would
# fail `check-schemas` for no reason its author could see.
#
# `mcp` floors this at >=2.8, so 2.5.2 is not available to go back to. Moving it
# is a deliberate act: bump this pin, run `make schemas`, and commit the
# regenerated schemas in the same change. Ideally under VIR-47, with the Python
# pin.
pydantic = "~2.9.2"
fastapi = {extras = ["standard"], version = "^0.115.0"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
# Widened from ^0.25.2 for `mcp`, whose floor is httpx>=0.27. The ceiling is
# 0.29 rather than 0.28 because there is nothing here for a minor bump to break:
# the only call site in this package is `httpx.ASGITransport` in
# `server/test_meta.py`, which is unchanged across 0.25 -> 0.28, and nothing
# passes the `proxies=` argument 0.28 removed. Checked against the 0.28.1 the
# lock resolves to.
httpx = ">=0.27.1,<0.29"
uvicorn = {extras = ["standard"], version = "^0.24.0.post1"}
cvxpy = "^1.5"
# The MCP shim (planning/mcp.md, plan §16). A MAIN dependency, not part of the
# `sdk` extra, because both transports need it: `vlab mcp` on the researcher's
# machine AND `POST /mcp` in the conf service.
#
# Pinned exactly, and to 1.12.4 specifically, because that is the newest
# release whose own floors this project already satisfies: 1.13 raised
# `uvicorn>=0.31.1` and we run `uvicorn ^0.24`. Bumping the ASGI server at the
# same time as mounting a new route would be two deployment risks in one change
# rather than one. Revisit together with VIR-47.
#
# NOT OPTIONAL AT RUN TIME, despite serving one route: `server/server.py`
# imports `server/mcp_server.py` at module scope, so an `mcp` that fails to
# import takes the whole conf service down at start-up rather than degrading
# `POST /mcp`. That is why the project's own Python floor moved to 3.10 above,
# and why this carries no `python` marker: a marker here would make `mcp`
# absent on an interpreter the package claims to support, which is exactly the
# configuration that does not boot.
#
# THE FULL LOCK DELTA IT CAUSED, so nobody has to diff a 600-line lockfile to
# find out. Nine packages added -- mcp, httpx-sse, sse-starlette,
# pydantic-settings, jsonschema, jsonschema-specifications, referencing,
# rpds-py, pywin32 -- one dropped (sniffio, which anyio 4 no longer needs), and
# seven moved: anyio 3.7.1 -> 4.14.2, attrs 21.4.0 -> 26.1.0, httpx 0.25.2 ->
# 0.28.1, pydantic 2.5.2 -> 2.9.2, pydantic-core 2.14.5 -> 2.23.4,
# python-dotenv 0.19.2 -> 1.2.3, typing-extensions 4.9.0 -> 4.16.0. The four
# that changed BEHAVIOUR are written up in `planning/mcp.md` §5; the rest are
# transitive and were exercised only by the suite passing.
mcp = "1.12.4"
# Not a direct import of ours: `mcp` declares PEP 696 TypeVar defaults and
# needs a typing_extensions that understands them, but declares no floor of its
# own. The lock held 4.9.0, and `import mcp` died with "Too few parameters for
# RequestContext" -- an unreadable failure a long way from its cause. The floor
# is here so that is a resolver error instead.
typing-extensions = ">=4.13"
ecos = "^2.0"
# The `sdk` extra: the `vlab` CLI. Only click is here, because everything else
# the SDK needs -- requests, PyYAML, pydantic, pandas for the sheet readers --
# is already a hard dependency above. click is `optional = true` so that the
# server image (`poetry install --only main`) is unchanged by this; it lands
# there anyway, as a transitive dependency of uvicorn and typer.
click = {version = "^8.0.4", optional = true}

[tool.poetry.extras]
# pipx install 'adopt[sdk]'
sdk = ["click"]

[tool.poetry.group.dev.dependencies]
future = "^0.18.2"
pytest = "^6.2.4"
pytest-xdist = "^2.2.1"
coverage = "^5.5"
types-requests = "^2.31.0.10"
types-pyyaml = "^6.0.12.12"
python-lsp-server = {extras = ["all"], version = "^1.12.0"}
black = "^23.12.1"
isort = "^5.13.2"
mypy = "^1.8.0"
pylsp-mypy = "^0.6.8"
python-lsp-black = "^2.0.0"
pyls-isort = "^0.2.2"
pylsp-rope = "^0.1.11"
types-python-jose = "^3.3.4.8"
pandas-stubs = "^2.1.4.231218"
pytest-asyncio = "<0.26.0"

[tool.poetry.scripts]
# Checks field_contract.py against live Facebook ads. See adopt/README.md.
adopt-probe = "adopt.facebook.probe:main"
# The study-authoring CLI. Needs the `sdk` extra for click; declared
# unconditionally because a console script that is absent is harder to diagnose
# than one that fails with "No module named click".
vlab = "adopt.sdk.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.pytest.ini_options]
# `mcp` drags in anyio 4 (3.7.1 -> 4.14.2), whose pytest plugin imports
# `_pytest.scope` -- a module pytest 6 does not have, so merely INSTALLING the
# plugin made pytest fail at collection with "No module named '_pytest.scope'".
# Nothing in this suite uses it: the async tests drive their own loop with
# `asyncio.run` (see `server/test_meta.py`). Disabled rather than fixed by
# bumping pytest, because a pytest 6 -> 8 jump is a change to how ~2400 existing
# tests run and has nothing to do with MCP. Drop this line when pytest is
# bumped.
addopts = "-p no:anyio"
